[project]
name = "cloudgen"
version = "0.1.0"
description = "Train and sample the point-cloud model that draws gen-ascii objects."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
